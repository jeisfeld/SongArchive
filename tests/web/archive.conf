# Local credentials and Apache directory rules for the disposable test site.
<Directory /var/www/html>
    AllowOverride None
    DirectoryIndex index.html index.php
</Directory>

<DirectoryMatch "^/var/www/html/(admin|vip)(/|$)">
    AuthType Basic
    AuthName "Song Archive tests"
    AuthUserFile /etc/apache2/songarchive-test-users
    Require valid-user
</DirectoryMatch>

<Files "db_config.php">
    Require all denied
</Files>
